version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      rustcrypto:
        patterns:
          - "sha1"
          - "sha2"
          - "md-5"
          - "hmac"
          - "pbkdf2"
          - "aes"
          - "aes-gcm"
          - "cbc"
          - "digest"
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
