name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v3.2.0)"
        required: true
        default: "v3.2.0"
      draft:
        description: "Draft release"
        type: boolean
        default: false
      prerelease:
        description: "Prerelease"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_ext: ".exe"
            archive_ext: "zip"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_ext: ""
            archive_ext: "tar.gz"
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_ext: ""
            archive_ext: "tar.gz"
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_ext: ""
            archive_ext: "tar.gz"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libgtk-3-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binaries
        run: cargo build --release --target ${{ matrix.target }} --workspace

      - name: Package Release Assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkgName = "mail2rust-${{ matrix.target }}"
          $dir = "target/$pkgName"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mail2rust.exe" "$dir/"
          Copy-Item "target/${{ matrix.target }}/release/mail2rust-gui.exe" "$dir/"
          Copy-Item "README.md" "$dir/"
          Copy-Item "LICENSE-MIT" "$dir/"
          Copy-Item "LICENSE-APACHE" "$dir/"
          Copy-Item "CHANGELOG.md" "$dir/"
          Compress-Archive -Path "$dir/*" -DestinationPath "target/$pkgName.zip" -Force
          $hash = (Get-FileHash -Path "target/$pkgName.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $pkgName.zip" | Out-File -FilePath "target/$pkgName.zip.sha256" -Encoding ascii

      - name: Package Release Assets (Unix)
        if: runner.os != 'Windows'
        run: |
          PKG_NAME="mail2rust-${{ matrix.target }}"
          DIR="target/$PKG_NAME"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/mail2rust" "$DIR/"
          cp "target/${{ matrix.target }}/release/mail2rust-gui" "$DIR/"
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$DIR/"
          tar -czvf "target/$PKG_NAME.tar.gz" -C target "$PKG_NAME"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "target/$PKG_NAME.tar.gz" | awk '{print $1"  '$PKG_NAME'.tar.gz"}' > "target/$PKG_NAME.tar.gz.sha256"
          else
            shasum -a 256 "target/$PKG_NAME.tar.gz" | awk '{print $1"  '$PKG_NAME'.tar.gz"}' > "target/$PKG_NAME.tar.gz.sha256"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mail2rust-${{ matrix.target }}
          path: |
            target/mail2rust-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize Release Files and Compute Checksums
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Tag Name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Mail2Rust ${{ steps.get_tag.outputs.tag }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            dist/*
          generate_release_notes: true
