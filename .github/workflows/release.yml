name: Release

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag override (leave empty to auto-derive YYYY.MM.DD-<4-char-sha>)"
        required: false
        default: ""
      draft:
        description: "Draft release"
        type: boolean
        default: true
      sandbox_review_id:
        description: "Approved Windows Sandbox review ID"
        required: false
        default: ""
      prerelease:
        description: "Prerelease"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_ext: ".exe"
            archive_ext: "zip"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_ext: ""
            archive_ext: "tar.gz"
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_ext: ""
            archive_ext: "tar.gz"
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_ext: ""
            archive_ext: "tar.gz"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout shared guap-kit workspace
        run: git clone --depth 1 https://github.com/adpaolucci/guap-kit.git ../guap-kit

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libfontconfig1-dev \
            libgtk-3-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binaries (x86_64 Windows MSVC Stack + CFG + CET)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          RUSTFLAGS: -C link-arg=/STACK:16777216 -C control-flow-guard=on -C link-arg=/CETCOMPAT
        run: cargo build --release --target ${{ matrix.target }} --workspace

      - name: Build Release Binaries
        if: matrix.target != 'x86_64-pc-windows-msvc'
        run: cargo build --release --target ${{ matrix.target }} --workspace

      - name: Package Release Assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkgName = "mail2rust-${{ matrix.target }}"
          $dir = "target/$pkgName"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mail2rust.exe" "$dir/"
          Copy-Item "target/${{ matrix.target }}/release/mail2rust-win32.exe" "$dir/"
          Copy-Item "target/${{ matrix.target }}/release/mail2rust-iced.exe" "$dir/"
          Copy-Item "target/${{ matrix.target }}/release/mail2rust-mcp.exe" "$dir/"
          Copy-Item "README.md" "$dir/"
          Copy-Item "LICENSE" "$dir/"
          Copy-Item "NOTICE" "$dir/"
          Copy-Item "CHANGELOG.md" "$dir/"
          cargo tree --workspace --locked | Out-File -FilePath "$dir/SBOM-crates.txt" -Encoding utf8
          Compress-Archive -Path "$dir/*" -DestinationPath "target/$pkgName.zip" -Force
          $hash = (Get-FileHash -Path "target/$pkgName.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $pkgName.zip" | Out-File -FilePath "target/$pkgName.zip.sha256" -Encoding ascii

      - name: Package Release Assets (Unix)
        if: runner.os != 'Windows'
        run: |
          PKG_NAME="mail2rust-${{ matrix.target }}"
          DIR="target/$PKG_NAME"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/mail2rust" "$DIR/"
          cp "target/${{ matrix.target }}/release/mail2rust-iced" "$DIR/"
          cp "target/${{ matrix.target }}/release/mail2rust-mcp" "$DIR/"
          cp README.md LICENSE NOTICE CHANGELOG.md "$DIR/"
          cargo tree --workspace --locked > "$DIR/SBOM-crates.txt"
          tar -czvf "target/$PKG_NAME.tar.gz" -C target "$PKG_NAME"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "target/$PKG_NAME.tar.gz" | awk '{print $1"  '$PKG_NAME'.tar.gz"}' > "target/$PKG_NAME.tar.gz.sha256"
          else
            shasum -a 256 "target/$PKG_NAME.tar.gz" | awk '{print $1"  '$PKG_NAME'.tar.gz"}' > "target/$PKG_NAME.tar.gz.sha256"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mail2rust-${{ matrix.target }}
          path: |
            target/mail2rust-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: release-approval
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Organize Release Files and Compute Checksums
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          find ../release-artifacts -type f -name "*.sha256" -exec cp {} . \;
          cat SHA256SUMS.txt

      - name: Determine Tag Name
        id: get_tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_TAG_NAME" ]; then
              TAG="$INPUT_TAG_NAME"
            else
              TAG="$(date -u +%Y.%m.%d)-$(git rev-parse HEAD | cut -c1-4)"
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]{4}$ ]]; then
            echo "::error::Invalid Policy G10 release tag '$TAG'. Expected YYYY.MM.DD-<4-char-hex-sha>."
            exit 1
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Fill Packaging Manifest Hashes
        shell: bash
        env:
          TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          python3 scripts/packaging_hashes.py --repo mail2rust --version "$VERSION" --assets-dir dist
          zip -r dist/packaging-manifests-ready.zip packaging

      - name: Record Windows Sandbox Review Gate
        shell: bash
        env:
          TAG_NAME: ${{ steps.get_tag.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
          INPUT_SANDBOX_REVIEW_ID: ${{ inputs.sandbox_review_id }}
          IS_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == false && 'false' || 'true' }}
        run: |
          REVIEW_ID="${INPUT_SANDBOX_REVIEW_ID:-pending-draft-review}"
          {
            printf '%s\n' "### Windows Sandbox Review Gate"
            printf -- '- Tag: `%s`\n' "$TAG_NAME"
            printf -- '- Commit: `%s`\n' "$COMMIT_SHA"
            printf -- '- Windows Sandbox review ID: `%s`\n' "$REVIEW_ID"
            printf -- '- Draft Release: `%s`\n' "$IS_DRAFT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Mail2rust ${{ steps.get_tag.outputs.tag }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == false && 'false' || 'true' }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            dist/*
          generate_release_notes: true
