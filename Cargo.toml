[workspace]
members = [
    "crates/mail2rust-core",
    "crates/mail2rust-pst",
    "crates/mail2rust-eml",
    "crates/mail2rust-mbox",
    "crates/mail2rust-filter",
    "crates/mail2rust-forensics",
    "crates/mail2rust-sync",
    "crates/mail2rust-imap",
    "crates/mail2rust-cli",
    "crates/mail2rust-win32",
    "crates/mail2rust-iced",
    "crates/mail2rust-mcp",
]
resolver = "2"

[workspace.package]
version = "3.5.0"
edition = "2024"
rust-version = "1.89"
authors = ["Andrew Paolucci <andrew@paolucci.ca>", "Mail2Rust Contributors"]
license = "Apache-2.0"
repository = "https://github.com/adpaolucci/mail2rust"
homepage = "https://mail2rust.guap.ca"
documentation = "https://mail2rust.guap.ca"
description = "100% pure-Rust [MS-PST] container engine, universal mailbox migrator, eDiscovery auditor, dual Win32/Iced GUIs, CLI, and MCP server"
keywords = ["email", "pst", "mbox", "forensics", "mcp"]
categories = ["command-line-utilities", "email", "gui"]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crc32fast = "1.4"
sha2 = "0.11"
md-5 = "0.10"
byteorder = "1.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
flate2 = "1.0"
walkdir = "2.5"
regex = "1.11"
uuid = { version = "1.10", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive"] }
zip = { version = "9.8", default-features = false, features = ["deflate"] }
ctrlc = "3.4"
rfd = "0.18"
arboard = "3.6"
winsafe = { version = "0.0.29", features = ["gui", "shell"] }
iced = { version = "0.14", features = ["wgpu", "tiny-skia", "tokio", "image-without-codecs"] }
tempfile = "3.17"

mail2rust-core = { path = "crates/mail2rust-core" }
mail2rust-pst = { path = "crates/mail2rust-pst" }
mail2rust-eml = { path = "crates/mail2rust-eml" }
mail2rust-mbox = { path = "crates/mail2rust-mbox" }
mail2rust-filter = { path = "crates/mail2rust-filter" }
mail2rust-forensics = { path = "crates/mail2rust-forensics" }
mail2rust-sync = { path = "crates/mail2rust-sync" }
mail2rust-imap = { path = "crates/mail2rust-imap" }
mail2rust-mcp = { path = "crates/mail2rust-mcp" }

[profile.dev.package.clap]
opt-level = 2

[profile.dev.package.clap_builder]
opt-level = 2

[profile.dev.package.clap_derive]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
