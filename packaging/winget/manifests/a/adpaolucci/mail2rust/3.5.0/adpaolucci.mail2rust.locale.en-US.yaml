Description: >-
  mail2rust is a pure-Rust universal email and mailbox migration suite featuring a clean-room 64-bit Unicode [MS-PST]
  reader/writer without Outlook COM dependencies, a native zero-GPU Win32 desktop console (mail2rust-win32 via WinSafe),
  a cross-platform Iced GUI (mail2rust-iced), a full CLI, RFC 6234 SHA-256 Merkle chain-of-custody forensics,
  direct IMAP/JMAP ingestion, and a JSON-RPC 2.0 stdio MCP server.
