# Smithery configuration for mail2rust
# https://smithery.ai
name: mail2rust-mcp
version: "3.5.0"
description: "Universal offline email migration, forensic auditing, and MS-PST binary engine in 100% pure Rust (zero Outlook/MAPI dependencies)"
repository: "https://github.com/adpaolucci/mail2rust"
license: "Apache-2.0"

entrypoint:
  type: stdio
  command: mail2rust-mcp

build:
  type: cargo
  crate: mail2rust-mcp

tools:
  - name: mail2rust_sniff
    description: "Inspect magic bytes and identify mailbox format (PST, OST, MBOX, EML, EMLX, MSG, OLM, Maildir)."
  - name: mail2rust_validate_pst
    description: "Validate 64-bit Unicode MS-PST binary integrity, CRC-32 header, and B-Trees without Outlook."
  - name: mail2rust_convert
    description: "Convert mailbox between formats (MBOX to PST, PST to EML tree, EML to PST, Maildir to PST)."
  - name: mail2rust_audit
    description: "Perform forensic audit on mailbox: compute SHA-256 hashes, Bates stamping, and chain of custody."
  - name: mail2rust_split
    description: "Split oversized mailbox into chunked volume archives preserving folder hierarchies."
  - name: mail2rust_merge
    description: "Merge multiple disparate mailbox archives into a unified container with cross-archive deduplication."
  - name: mail2rust_nk2_inspect
    description: "Parse and query an Outlook .NK2 or Stream_Autocomplete_*.dat autocomplete cache file (read-only)."
  - name: mail2rust_nk2_edit
    description: "Add, update, remove, deduplicate, or merge entries in an .NK2 / Stream_Autocomplete_*.dat file (mutating; requires AllowMutating + confirm_destructive=true)."
  - name: mail2rust_outlook_attach
    description: "List attachments in a PST, OST, MSG, MBOX, or EML source (read-only)."
  - name: mail2rust_outlook_attach_extract
    description: "Bulk extract filtered attachments from PST/OST/MSG/MBOX/EML into a destination directory with SHA-256 custody manifest (read-only on source)."
  - name: mail2rust_outlook_attach_strip
    description: "Strip matching attachments from a PST/OST/MSG container (mutating; requires AllowMutating + confirm_destructive=true)."
  - name: mail2rust_outlook_stats
    description: "Aggregate PST/OST/MSG/MBOX/EML communication statistics by correspondent, domain, folder, or month (read-only)."
  - name: mail2rust_outlook_contacts
    description: "Extract contacts and distribution lists from PST/OST (IPM.Contact/IPM.DistList), OAB, NK2, or vCard files (read-only)."
  - name: mail2rust_office_addins
    description: "List Microsoft Office & Outlook add-ins from live Windows Registry or offline NTUSER.DAT/SOFTWARE regf hives (read-only)."
  - name: mail2rust_office_addins_toggle
    description: "Enable or disable an Office/Outlook add-in LoadBehavior in live Windows Registry (mutating; requires AllowMutating + confirm_destructive=true)."
